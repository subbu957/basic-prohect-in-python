  <style>
    :root {
      --bg: #0f172a;

    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    header { max-width: 1200px; margin: 0 auto 30px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 12px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: var(--text-muted); font-size: 1.1rem; max-width: 800px; margin: 0 auto 20px; }
    .stats-bar { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
    .stat-pill { background: var(--card-bg); border: 1px solid var(--border); padding: 8px 18px; border-radius: 9999px; font-weight: 600; font-size: 0.95rem; color: var(--primary); }
    .search-box { max-width: 700px; margin: 0 auto 30px; position: relative; }
    input#search { width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input#search:focus { border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-num { background: #334155; color: #38bdf8; font-size: 0.8rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .card-title { font-size: 1.25rem; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .card-focus { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }
    .preview-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: "Consolas", monospace; font-size: 0.8rem; color: #38bdf8; overflow-x: auto; white-space: pre-wrap; max-height: 140px; margin-bottom: 15px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; pt: 10px; }
    .btn { background: var(--primary); color: #000; font-weight: 600; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s; text-decoration: none; font-size: 0.85rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: #fff; margin-left: 8px; }
    .btn-secondary:hover { background: #475569; }
    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 800px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 20px; overflow-y: auto; }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    pre.code-viewer { background: var(--code-bg); padding: 16px; border-radius: 8px; color: #a5f3fc; font-family: "Consolas", monospace; font-size: 0.85rem; overflow-x: auto; line-height: 1.5; }

  <script>
    const projects = [{"num": 1, "slug": "001_password_manager_vault", "title": "Password Manager Vault", "focus": "CLI app that creates a local encrypted-style vault using PBKDF2 + Fernet.", "preview": "==============================================================\n           === PREVIEW: PASSWORD MANAGER VAULT ===            \n==============================================================\n$ python main.py\n=== Password Manager Vault ===\nMaster password: [hidden]\n[*] Creating a new encrypted vault...\n\n1.Add  2.List  3.Get  4.Delete  5.Exit\nChoice: 1\nSite: github.com\nUsername: subbu_dev\nPassword: [hidden]\n[+] Stored credentials for github.com\n\n1.Add  2.List  3.Get  4.Delete  5.Exit\nChoice: 2\n--- Stored Sites ---\ngithub.com\n\n1.Add  2.List  3.Get  4.Delete  5.Exit\nChoice: 5\n[*] Vault saved securely. Goodbye!\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n1. Password Manager Vault\nCLI app that creates a local encrypted-style vault using PBKDF2 + Fernet.\n\"\"\"\n\nimport os, json, base64, getpass, sys\nfrom cryptography.fernet import Fernet\nfrom hashlib import pbkdf2_hmac\n\nFILE = \"vault.json\"\n\ndef key_from_password(password: str, salt: bytes) -> bytes:\n    raw = pbkdf2_hmac(\"sha256\", password.encode(), salt, 200_000, 32)\n    return base64.urlsafe_b64encode(raw)\n\ndef load():\n    if not os.path.exists(FILE):\n        return None\n    with open(FILE, \"r\", encoding=\"utf-8\") as f:\n        return json.load(f)\n\ndef prompt_pass(msg=\"Password: \"):\n    if not sys.stdin.isatty():\n        line = sys.stdin.readline()\n        return line.strip() if line else \"\"\n    try:\n        return getpass.getpass(msg)\n    except Exception:\n        return input(msg)\n\ndef main():\n    print(\"=== Password Manager Vault ===\")\n    master = prompt_pass(\"Master password: \")\n    data = load()\n    if data:\n        salt = base64.b64decode(data[\"salt\"])\n        key = key_from_password(master, salt)\n        f = Fernet(key)\n        try:\n            records = json.loads(f.decrypt(data[\"blob\"].encode()).decode())\n        except Exception:\n            raise SystemExit(\"Wrong password or damaged vault.\")\n    else:\n        print(\"[*] Creating a new encrypted vault...\")\n        salt = os.urandom(16)\n        key = key_from_password(master, salt)\n        f = Fernet(key)\n        records = {}\n\n    while True:\n        print(\"\\n1.Add  2.List  3.Get  4.Delete  5.Exit\")\n        choice = input(\"Choice: \").strip()\n        if choice == \"1\":\n            site = input(\"Site: \").strip()\n            user = input(\"Username: \").strip()\n            pwd = prompt_pass(\"Password: \")\n            records[site] = {\"username\": user, \"password\": pwd}\n            print(f\"[+] Stored credentials for {site}\")\n        elif choice == \"2\":\n            if not records:\n                print(\"[!] No credentials stored yet.\")\n            else:\n                print(\"--- Stored Sites ---\")\n                print(*records.keys(), sep=\"\\n\")\n        elif choice == \"3\":\n            site = input(\"Site: \").strip()\n            item = records.get(site)\n            if item:\n                print(f\"Username: {item['username']} | Password: {item['password']}\")\n            else:\n                print(\"Not found\")\n        elif choice == \"4\":\n            site = input(\"Site to delete: \").strip()\n            if records.pop(site, None):\n                print(f\"[-] Deleted {site}\")\n            else:\n                print(\"Not found\")\n        elif choice == \"5\":\n            blob = f.encrypt(json.dumps(records).encode()).decode()\n            with open(FILE, \"w\", encoding=\"utf-8\") as fp:\n                json.dump({\"salt\": base64.b64encode(salt).decode(), \"blob\": blob}, fp)\n            print(\"[*] Vault saved securely. Goodbye!\")\n            break\n\nif __name__ == \"__main__\":\n    main()\n"}, {"num": 2, "slug": "002_personal_expense_tracker", "title": "Personal Expense Tracker", "focus": "SQLite-backed expense tracker with categories, monthly totals and CSV export.", "preview": "==============================================================\n          === PREVIEW: PERSONAL EXPENSE TRACKER ===           \n==============================================================\n$ python main.py\n1 Add  2 Report  3 Export  4 Exit\n> 2\nMonth YYYY-MM [e.g. 2026-11]: 2026-11\n--- Expense Breakdown for 2026-11 ---\nGroceries       | $85.50\nUtilities       | $60.00\nDining          | $45.00\nTotal: $190.50\n\n1 Add  2 Report  3 Export  4 Exit\n> 3\n[+] Exported 3 records to expenses.csv.\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n2. Personal Expense Tracker\nSQLite-backed expense tracker with categories, monthly totals and CSV export.\n\"\"\"\n\nimport sqlite3, csv\nfrom datetime import date\n\ndb = sqlite3.connect(\"expenses.db\")\ndb.execute(\"\"\"CREATE TABLE IF NOT EXISTS expenses(\n id INTEGER PRIMARY KEY, day TEXT, category TEXT, note TEXT, amount REAL)\"\"\")\ndb.commit()\n\ndef add():\n    day = input(\"Date YYYY-MM-DD [today]: \").strip() or str(date.today())\n    cat = input(\"Category: \").strip()\n    note = input(\"Note: \").strip()\n    amount = float(input(\"Amount: \").strip() or 0.0)\n    db.execute(\"INSERT INTO expenses(day,category,note,amount) VALUES(?,?,?,?)\",\n               (day, cat, note, amount))\n    db.commit()\n    print(\"[+] Expense recorded successfully.\")\n\ndef report():\n    month = input(\"Month YYYY-MM [e.g. 2026-11]: \").strip() or str(date.today())[:7]\n    rows = db.execute(\"\"\"SELECT category, SUM(amount)\n                         FROM expenses WHERE day LIKE ? GROUP BY category ORDER BY 2 DESC\"\"\",\n                      (month + \"-%\",)).fetchall()\n    print(f\"\\n--- Expense Breakdown for {month} ---\")\n    if not rows:\n        print(\"No expenses found for this month.\")\n    else:\n        print(\"\\n\".join(f\"{c:15} | ${a:.2f}\" for c, a in rows))\n    total = db.execute(\"SELECT COALESCE(SUM(amount),0) FROM expenses WHERE day LIKE ?\",\n                       (month + \"-%\",)).fetchone()[0]\n    print(f\"Total: ${total:.2f}\")\n\ndef export():\n    rows = db.execute(\"SELECT day,category,note,amount FROM expenses\").fetchall()\n    with open(\"expenses.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        w = csv.writer(f)\n        w.writerow([\"date\", \"category\", \"note\", \"amount\"])\n        w.writerows(rows)\n    print(f\"[+] Exported {len(rows)} records to expenses.csv.\")\n\ndef main():\n    while True:\n        print(\"\\n1 Add  2 Report  3 Export  4 Exit\")\n        c = input(\"> \").strip()\n        if c == \"1\": add()\n        elif c == \"2\": report()\n        elif c == \"3\": export()\n        elif c == \"4\": break\n\nif __name__ == \"__main__\":\n    main()\n"}, {"num": 3, "slug": "003_file_organizer_pro", "title": "File Organizer Pro", "focus": "Desktop folder organizer with extension rules, duplicate detection and dry-run mode.", "preview": "==============================================================\n             === PREVIEW: FILE ORGANIZER PRO ===              \n==============================================================\n$ python main.py\nFolder to organize [demo_files]: demo_files\nDry run? y/n [y]: y\nScanning target: demo_files (dry_run=True)\n  invoice.pdf -> Documents/invoice.pdf\n  photo.jpg -> Images/photo.jpg\n[DUPLICATE] photo_dup.jpg => matched photo.jpg\n  report.docx -> Documents/report.docx\n  song.mp3 -> Audio/song.mp3\n[*] Organization process completed.\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n3. File Organizer Pro\nDesktop folder organizer with extension rules, duplicate detection and dry-run mode.\n\"\"\"\n\nfrom pathlib import Path\nimport hashlib, shutil\n\nrules = {\n    \"Images\": {\".jpg\", \".jpeg\", \".png\", \".gif\", \".webp\"},\n    \"Documents\": {\".pdf\", \".docx\", \".doc\", \".txt\", \".xlsx\", \".csv\"},\n    \"Videos\": {\".mp4\", \".mkv\", \".mov\", \".avi\"},\n    \"Audio\": {\".mp3\", \".wav\", \".flac\"},\n    \"Archives\": {\".zip\", \".rar\", \".7z\", \".tar\", \".gz\"},\n}\n\ndef digest(path):\n    h = hashlib.sha256()\n    with open(path, \"rb\") as f:\n        for chunk in iter(lambda: f.read(1024 * 1024), b\"\"):\n            h.update(chunk)\n    return h.hexdigest()\n\ndef organize(root_dir=\"demo_files\", dry_run=True):\n    ROOT = Path(root_dir).expanduser().resolve()\n    ROOT.mkdir(parents=True, exist_ok=True)\n    seen = {}\n    print(f\"Scanning target: {ROOT} (dry_run={dry_run})\")\n    for p in ROOT.iterdir():\n        if not p.is_file(): continue\n        folder = next((k for k, v in rules.items() if p.suffix.lower() in v), \"Others\")\n        target = ROOT / folder\n        target.mkdir(exist_ok=True)\n        key = (p.stat().st_size, digest(p))\n        if key in seen:\n            print(f\"[DUPLICATE] {p.name} => matched {seen[key].name}\")\n            continue\n        seen[key] = p\n        dest = target / p.name\n        print(f\"  {p.name} -> {folder}/{p.name}\")\n        if not dry_run:\n            shutil.move(str(p), str(dest))\n    print(\"[*] Organization process completed.\")\n\ndef main():\n    root_input = input(\"Folder to organize [demo_files]: \").strip() or \"demo_files\"\n    dry_input = input(\"Dry run? y/n [y]: \").strip().lower()\n    dry_run = dry_input != \"n\"\n    organize(root_input, dry_run)\n\nif __name__ == \"__main__\":\n    main()\n"}, {"num": 4, "slug": "004_pdf_invoice_generator", "title": "PDF Invoice Generator", "focus": "Generate professional invoices from a JSON order file.", "preview": "==============================================================\n            === PREVIEW: PDF INVOICE GENERATOR ===            \n==============================================================\n$ python main.py\n[+] invoice.pdf created successfully for Subbu Tech Innovations.\n\nGenerated Table Breakdown:\nItem                         Qty   Price     Amount\n---------------------------------------------------\nMechanical Keyboard Pro       1    $120.00   $120.00\nUltra-Wide 4K Monitor         1    $450.00   $450.00\nUSB-C Hub Multiport           2    $35.50    $71.00\nTOTAL                                        $641.00\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n4. PDF Invoice Generator\nGenerate professional invoices from a JSON order file.\n\"\"\"\n\nfrom reportlab.lib.pagesizes import A4\nfrom reportlab.platypus import SimpleDocTemplate, Paragraph, Table, TableStyle, Spacer\nfrom reportlab.lib import colors\nfrom reportlab.lib.styles import getSampleStyleSheet\nimport json\n\ndef generate_invoice(order_file=\"order.json\", output_pdf=\"invoice.pdf\"):\n    with open(order_file, \"r\", encoding=\"utf-8\") as f:\n        order = json.load(f)\n    doc = SimpleDocTemplate(output_pdf, pagesize=A4, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)\n    styles = getSampleStyleSheet()\n    story = [\n        Paragraph(\"<b>INVOICE</b>\", styles[\"Title\"]),\n        Paragraph(f\"<b>Customer:</b> {order['customer']}\", styles[\"Normal\"]),\n        Spacer(1, 15)\n    ]\n    rows = [[\"Item\", \"Qty\", \"Price\", \"Amount\"]]\n    total = 0\n    for x in order[\"items\"]:\n        amount = x[\"qty\"] * x[\"price\"]\n        total += amount\n        rows.append([x[\"name\"], str(x[\"qty\"]), f\"${x['price']:.2f}\", f\"${amount:.2f}\"])\n    rows.append([\"\", \"\", \"TOTAL\", f\"${total:.2f}\"])\n    t = Table(rows, colWidths=[230, 50, 80, 90])\n    t.setStyle(TableStyle([\n        (\"BACKGROUND\", (0, 0), (-1, 0), colors.black),\n        (\"TEXTCOLOR\", (0, 0), (-1, 0), colors.white),\n        (\"GRID\", (0, 0), (-1, -1), 0.5, colors.grey),\n        (\"ALIGN\", (1, 1), (-1, -1), \"RIGHT\"),\n        (\"FONTNAME\", (0, 0), (-1, 0), \"Helvetica-Bold\")\n    ]))\n    story += [t, Spacer(1, 20), Paragraph(\"Thank you for your business.\", styles[\"Normal\"])]\n    doc.build(story)\n    print(f\"[+] {output_pdf} created successfully for {order['customer']}.\")\n\nif __name__ == \"__main__\":\n    generate_invoice()\n"}, {"num": 5, "slug": "005_quiz_master_app", "title": "Quiz Master App", "focus": "Timed JSON-driven quiz with scoring, review and leaderboard storage.", "preview": "==============================================================\n               === PREVIEW: QUIZ MASTER APP ===               \n==============================================================\n$ python main.py\n1/3 What is the keyword used to define a function in Python?\n  1. func\n  2. def\n  3. function\n  4. lambda\nAnswer: 2\n  -> Correct!\n\nYour name [Player]: Subbu\nScore: 3/3 | Time: 4.2s\nTop players:\n  Subbu           Score: 3  Time: 4.2s\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n5. Quiz Master App\nTimed JSON-driven quiz with scoring, review and leaderboard storage.\n\"\"\"\n\nimport json, random, time\nfrom pathlib import Path\n\ndef run_quiz():\n    questions = json.load(open(\"questions.json\", \"r\", encoding=\"utf-8\"))\n    random.shuffle(questions)\n    score = 0\n    wrong = []\n    start = time.time()\n    for i, q in enumerate(questions, 1):\n        print(f\"\\n{i}/{len(questions)} {q['question']}\")\n        for j, opt in enumerate(q[\"options\"], 1):\n            print(f\"  {j}. {opt}\")\n        try:\n            ans = int(input(\"Answer: \").strip())\n        except Exception:\n            ans = 0\n        if ans == q[\"answer\"]:\n            print(\"  -> Correct!\")\n            score += 1\n        else:\n            print(f\"  -> Incorrect! Correct answer was: {q['options'][q['answer'] - 1]}\")\n            wrong.append(q)\n    elapsed = time.time() - start\n    name = input(\"\\nYour name [Player]: \").strip() or \"Player\"\n    board = []\n    if Path(\"leaderboard.json\").exists():\n        try:\n            board = json.load(open(\"leaderboard.json\", \"r\", encoding=\"utf-8\"))\n        except Exception:\n            board = []\n    board.append({\"name\": name, \"score\": score, \"time\": round(elapsed, 1)})\n    board = sorted(board, key=lambda x: (-x[\"score\"], x[\"time\"]))[:10]\n    json.dump(board, open(\"leaderboard.json\", \"w\", encoding=\"utf-8\"), indent=2)\n    print(f\"\\nScore: {score}/{len(questions)} | Time: {elapsed:.1f}s\")\n    print(\"\\nTop players:\")\n    for x in board:\n        print(f\"  {x['name']:<15} Score: {x['score']}  Time: {x['time']}s\")\n\nif __name__ == \"__main__\":\n    run_quiz()\n"}, {"num": 6, "slug": "006_url_shortener_service", "title": "URL Shortener Service", "focus": "Flask API that creates short links and tracks click counts.", "preview": "==============================================================\n            === PREVIEW: URL SHORTENER SERVICE ===            \n==============================================================\n$ python main.py --test\nPOST /shorten response: {'code': 'xK92a', 'short_url': 'http://localhost/xK92a'}\nGET /stats response: {'clicks': 1, 'code': 'xK92a', 'url': 'https://github.com/subbu957'}\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n6. URL Shortener Service\nFlask API that creates short links and tracks click counts.\n\"\"\"\n\nfrom flask import Flask, request, redirect, jsonify\nimport secrets, sqlite3\n\napp = Flask(__name__)\ndb = sqlite3.connect(\"links.db\", check_same_thread=False)\ndb.execute(\"CREATE TABLE IF NOT EXISTS links(code TEXT PRIMARY KEY, url TEXT, clicks INTEGER DEFAULT 0)\")\ndb.commit()\n\n@app.post(\"/shorten\")\ndef shorten():\n    data = request.json or {}\n    url = data.get(\"url\", \"\")\n    code = secrets.token_urlsafe(5)\n    db.execute(\"INSERT INTO links(code, url) VALUES(?, ?)\", (code, url))\n    db.commit()\n    return jsonify({\"code\": code, \"short_url\": request.host_url + code})\n\n@app.get(\"/<code>\")\ndef go(code):\n    row = db.execute(\"SELECT url FROM links WHERE code=?\", (code,)).fetchone()\n    if not row:\n        return \"Not found\", 404\n    db.execute(\"UPDATE links SET clicks=clicks+1 WHERE code=?\", (code,))\n    db.commit()\n    return redirect(row[0])\n\n@app.get(\"/stats/<code>\")\ndef stats(code):\n    row = db.execute(\"SELECT code, url, clicks FROM links WHERE code=?\", (code,)).fetchone()\n    return jsonify(dict(zip([\"code\", \"url\", \"clicks\"], row))) if row else (\"Not found\", 404)\n\nif __name__ == \"__main__\":\n    import sys\n    if \"--test\" in sys.argv:\n        client = app.test_client()\n        r1 = client.post(\"/shorten\", json={\"url\": \"https://github.com/subbu957\"})\n        print(\"POST /shorten response:\", r1.json)\n        code = r1.json[\"code\"]\n        client.get(f\"/{code}\")\n        r2 = client.get(f\"/stats/{code}\")\n        print(\"GET /stats response:\", r2.json)\n    else:\n        app.run(debug=True, port=5000)\n"}, {"num": 7, "slug": "007_weather_dashboard", "title": "Weather Dashboard", "focus": "CLI weather dashboard using Open-Meteo with caching and forecast summaries.", "preview": "==============================================================\n              === PREVIEW: WEATHER DASHBOARD ===              \n==============================================================\n$ python main.py\nCity [Hyderabad]: Hyderabad\nFetching real-time weather data for Hyderabad...\nLocation: Hyderabad, India\nCurrent:  28.4\u00b0C | Humidity: 54% | Wind: 8.2 km/h\n--- 7-Day Forecast ---\n  2026-11-20 -> High: 31.0\u00b0C | Low: 19.5\u00b0C | Rain: 0%\n  2026-11-21 -> High: 30.5\u00b0C | Low: 19.0\u00b0C | Rain: 5%\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n7. Weather Dashboard\nCLI weather dashboard using     10       [OK]\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n10. Inventory Management System\nSQLite inventory with stock alerts, purchase entries and sales deductions.\n\"\"\"\n\nimport sqlite3\n\ndb = sqlite3.connect(\"inventory.db\")\ndb.execute(\"\"\"CREATE TABLE IF NOT EXISTS items(\n sku TEXT PRIMARY KEY, name TEXT, stock INTEGER, price REAL, reorder INTEGER)\"\"\")\ndb.commit()\n\ndef add_item():\n    sku = input(\"SKU: \").strip()\n    name = input(\"Name: \").strip()\n    stock = int(input(\"Stock: \").strip() or 0)\n    price = float(input(\"Price: \").strip() or 0.0)\n    reorder = int(input(\"Reorder level: \").strip() or 10)\n    db.execute(\"INSERT OR REPLACE INTO items VALUES(?,?,?,?,?)\", (sku, name, stock, price, reorder))\n    db.commit()\n    print(f\"[+] Item '{name}' saved.\")\n\ndef sell():\n    sku = input(\"SKU: \").strip()\n    qty = int(input(\"Qty to sell: \").strip() or 1)\n    row = db.execute(\"SELECT stock, name FROM items WHERE sku=?\", (sku,)).fetchone()\n    if not row or row[0] < qty:\n        print(\"[!] Insufficient stock or SKU not found.\")\n        return\n    db.execute(\"UPDATE items SET stock=stock-? WHERE sku=?\", (qty, sku))\n    db.commit()\n    print(f\"[+] Sold {qty} units of {row[1]}. Remaining: {row[0] - qty}\")\n\ndef report():\n    print(f\"\\n{'SKU':<10} {'Name':<22} {'Stock':<8} {'Price':<10} {'Reorder':<8} Status\")\n    print(\"-\" * 68)\n    for r in db.execute(\"SELECT sku, name, stock, price, reorder FROM items ORDER BY stock\"):\n        flag = \" [LOW STOCK]\" if r[2] <= r[4] else \" [OK]\"\n        print(f\"{r[0]:<10} {r[1]:<22} {r[2]:<8} ${r[3]:<9.2f} {r[4]:<8}{flag}\")\n\ndef main():\n    while True:\n        print(\"\\n1 Add/Update  2 Sell  3 Report  4 Exit\")\n        c = input(\"> \").strip()\n        if c == \"1\": add_item()\n        elif c == \"2\": sell()\n        elif c == \"3\": report()\n        else: break\n\nif __name__ == \"__ ={top}\")\n\ndef main():\n    filepath = input(\"Data CSV [sample.csv]: \").strip() or \"sample.csv\"\n    profile_csv(filepath)\n\nif __name__ == \"__main__\":\n    main()\n"}, {"num": 100, "slug": "100_flappy_bird_clone", "title": "Flappy Bird Clone", "focus": "Pygame arcade game with collision and score.", "preview": "==============================================================\n              === PREVIEW: FLAPPY BIRD CLONE ===              \n==============================================================\n$ python main.py --dry-run\nSyncing from 'demo_source' -> 'demo_backup' (dry_run=True)\n  asset.txt -> asset.txt\n  data.json -> data.json\nBackup complete. 2 files synced.\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n100. Flappy Bird Clone\nFocus: Pygame arcade game with collision and score.\n\"\"\"\n\nimport argparse, shutil, hashlib\nfrom pathlib import Path\n\ndef digest(p):\n    h = hashlib.sha256()\n    with open(p, \"rb\") as f:\n        for c in iter(lambda: f.read(1024 * 1024), b\"\"):\n            h.update(c)\n    return h.hexdigest()\n\ndef sync_backup(source_dir, backup_dir, dry_run=False):\n    source = Path(source_dir).resolve()\n    backup = Path(backup_dir).resolve()\n    print(f\"Syncing from '{source}' -> '{backup}' (dry_run={dry_run})\")\n    copied = 0\n    for src in source.rglob(\"*\"):\n        if not src.is_file(): continue\n        dst = backup / src.relative_to(source)\n        dst.parent.mkdir(parents=True, exist_ok=True)\n        if dst.exists() and digest(src) == digest(dst):\n            continue\n        print(f\"  {src.name} -> {dst.name}\")\n        if not dry_run:\n            shutil.copy2(src, dst)\n        copied += 1\n    print(f\"Backup complete. {copied} files synced.\")\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Flappy Bird Clone Backup Sync\")\n    parser.add_argument(\"source\", nargs=\"?\", default=\"demo_source\", type=Path, help=\"Source directory\")\n    parser.add_argument(\"backup\", nargs=\"?\", default=\"demo_backup\", type=Path, help=\"Backup destination directory\")\n    parser.add_argument(\"--dry-run\", action=\"store_true\", help=\"Perform dry run without copying\")\n    args = parser.parse_args()\n\n    # Create demo files if demo_source is used and empty\n    if str(args.source) == \"demo_source\" and not args.source.exists():\n        args.source.mkdir(parents=True, exist_ok=True)\n        (args.source / \"project_asset.txt\").write_text(\"Asset file for backup sync.\", encoding=\"utf-8\")\n        (args.source / \"config.json\").write_text('{\"version\": 1.0}', encoding=\"utf-8\")\n\n    sync_backup(args.source, args.backup, args.dry_run)\n\nif __name__ == \"__main__\":\n    main()\n"}, {"num": 101, "slug": "101_space_shooter", "title": "Space Shooter", "focus": "Pygame shooter with waves, power-ups and scoring.", "preview": "==============================================================\n                === PREVIEW: SPACE SHOOTER ===                \n==============================================================\n$ python main.py\n1 Add  2 List  3 Update  4 Export  5 Exit\n> 2\nID    Title                          Status       Priority   Created\n---------------------------------------------------------------------------\n1     Space Shooter Task 1    completed    5          2026-11-20T10:00:00\n2     Space Shooter Task 2    in-progress  4          2026-11-20T11:15:00\n\n1 Add  2 List  3 Update  4 Export  5 Exit\n> 4\n[+] Exported 2 records to space_shooter.json.\n==============================================================", "code": "# -*- coding: utf-8 -*-\n\"\"\"\n101. Space Shooter\nFocus: Pygame shooter with waves, power-ups and scoring.\n\"\"\"\n\nimport sqlite3, json\nfrom datetime import datetime\n\nDB = \"space_shooter.db\"\ndb = sqlite3.connect(DB)\ndb.execute(\"\"\"CREATE TABLE IF NOT EXISTS records(\n    id INTEGER PRIMARY KEY, title TEXT, status TEXT, priority INTEGER, created TEXT\n)\"\"\")\ndb.commit()\n\ndef add():\n    title = input(\"Title: \").strip()\n    status = input(\"Status [todo]: \").strip() or \"todo\"\n    priority = int(input(\"Priority 1-5 [3]: \").strip() or 3)\n    db.execute(\"INSERT INTO records(title,status,priority,created) VALUES(?,?,?,?)\",\n               (title, status, priority, datetime.now().isoformat(timespec=\"seconds\")))\n    db.commit()\n    print(\"[+] Record added successfully.\")\n\ndef list_items():\n    rows = db.execute(\"SELECT id,title,status,priority,created FROM records ORDER BY priority DESC, created DESC\").fetchall()\n    if not rows:\n        print(\"No records found.\")\n        return\n    print(f\"\\nID    Title                          Status       Priority   Created\")\n    print(\"-\" * 75)\n    for r in rows:\n        print(f\"{r[0]:<5} {r[1]:<30} {r[2]:<12} {r[3]:<10} {r[4]}\")\n\ndef update():\n    i = input(\"ID: \").strip()\n    s = input(\"New status: \").strip()\n    db.execute(\"UPDATE records SET status=? WHERE id=?\", (s, i))\n    db.commit()\n    print(f\"[+] Record {i} updated.\")\n\ndef export():\n    rows = db.execute(\"SELECT * FROM records\").fetchall()\n    json.dump(rows, open(\"space_shooter.json\", \"w\", encoding=\"utf-8\"), indent=2, default=str)\n    print(f\"[+] Exported {len(rows)} records to space_shooter.json.\")\n\ndef main():\n    while True:\n        print(\"\\n1 Add  2 List  3 Update  4 Export  5 Exit\")\n        c = input(\"> \").strip()\n        if c == \"1\": add()\n        elif c == \"2\": list_items()\n        elif c == \"3\": update()\n        elif c == \"4\": export()\n        elif c == \"5\": break\n\nif __name__ == \"__main__\":\n    main()\n"}];

    function renderProjects(items) {
      const grid = document.getElementById("projectGrid");
      grid.innerHTML = items.map(p => `
        <div class="card">
          <div class="card-header">
            <span class="card-num">#${String(p.num).padStart(3, '0')}</span>
          </div>
          <div class="card-title">${p.title}</div>
          <div class="card-focus">${p.focus}</div>
          <div class="preview-box">${p.preview}</div>
          <div class="card-footer">
            <button class="btn" onclick="openModal(${p.num})">View Code</button>
            <span style="font-size:0.75rem; color:var(--text-muted)">projects/${p.slug}</span>
          </div>
        </div>
      `).join('');
    }

    function filterProjects() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = projects.filter(p => p.title.toLowerCase().includes(q) || p.focus.toLowerCase().includes(q) || String(p.num).includes(q));
      renderProjects(filtered);
    }

    function openModal(num) {
      const p = projects.find(x => x.num === num);
      if (!p) return;
      document.getElementById("modalTitle").innerText = `#${String(p.num).padStart(3, '0')}: ${p.title}`;
      document.getElementById("modalCode").innerText = p.code;
      document.getElementById("codeModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("codeModal").classList.remove("active");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("codeModal");
      if (event.target === modal) {
        closeModal();
      }
    };

    renderProjects(projects);
  </script>
